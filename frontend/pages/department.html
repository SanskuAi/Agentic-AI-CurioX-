<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Department Tasks | AgenticAI</title>

    <link
        rel="stylesheet"
        href="../css/department.css"
    >

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            AgenticAI
        </div>

        <div class="nav-right">

            <span id="departmentName">
                Department
            </span>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <div class="heading">

            <div>

                <span class="page-badge">
                    AI WORK QUEUE
                </span>

                <h1>
                    Department Tasks
                </h1>

                <p>
                    AI-assigned infrastructure complaints
                    and resolution recommendations.
                </p>

            </div>

        </div>


        <!-- ================= TASKS ================= -->

        <div id="tasksContainer">

            <div class="loading-card">

                <div class="loader"></div>

                <p>
                    Loading assigned tasks...
                </p>

            </div>

        </div>

    </main>


    <script src="../js/department.js"></script>

</body>

</html>
