<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complete Task | InfraAI</title>

    <link
        rel="stylesheet"
        href="../css/department.css"
    >
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            InfraAI
        </div>

        <a
            href="department.html"
            class="view-btn"
        >
            Back
        </a>

    </nav>


    <main class="container">

        <div class="task-card">

            <h1>Complete Task</h1>

            <p>
                Add completion details and upload
                the after image.
            </p>


            <form id="completeForm">

                <label>Completion Message</label>

                <textarea
                    id="completionMessage"
                    placeholder="Example: Streetlight repaired and working."
                    required
                ></textarea>


                <label>After Image</label>

                <input
                    type="file"
                    id="afterImage"
                    accept="image/*"
                    required
                >


                <button type="submit">
                    Submit Completion
                </button>

            </form>


            <p id="message"></p>

        </div>

    </main>


    <script src="../js/complete-task.js"></script>

</body>

</html>
